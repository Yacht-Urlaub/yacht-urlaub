<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yacht buchen</title>
  <script type="text/javascript" src="https://www.planyo.com/utils.js"></script>
  <link rel="stylesheet" href="https://www.planyo.com/Plugins/PlanyoFiles/bootstrap-planyo.min.css" type="text/css" />
  <link rel="stylesheet" href="https://www.planyo.com/schemes/?calendar=46954&detect_mobile=auto&sel=scheme_css" type="text/css" />
  <link rel="stylesheet" href="https://www.planyo.com/li.css" type="text/css" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #f4f6f8; font-family: Arial, sans-serif; }

    .search-bar {
      background: #fff;
      border-bottom: 1px solid #e0e4ea;
      padding: 1.5rem 2rem;
      text-align: center;
    }

    .search-bar h3 {
      font-size: 1rem;
      color: #1a6eb5;
      margin: 0 0 1rem 0;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .form-row {
      display: inline-flex;
      align-items: flex-end;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      text-align: left;
    }

    .form-group label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #444;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .form-group input[type="text"],
    .form-group select {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9rem;
      min-width: 160px;
      height: 40px;
      color: #333;
    }

    .form-group input[type="text"]:focus,
    .form-group select:focus {
      outline: none;
      border-color: #1a6eb5;
      box-shadow: 0 0 0 2px rgba(26,110,181,0.15);
    }

    .btn-search {
      background: #1a6eb5;
      color: #fff;
      border: none;
      padding: 0 28px;
      height: 40px;
      border-radius: 4px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .btn-search:hover { background: #155a94; }

    .search-hint {
      font-size: 0.78rem;
      color: #888;
      margin-top: 0.75rem;
      font-style: italic;
    }

    /* Calendar picker */
    .picker_dropdown {
      position: absolute;
      visibility: hidden;
      z-index: 9999;
    }

    /* Results iframe — collapsed until a search is submitted, since the
       Planyo results page loads cross-origin and its real height can't
       be measured from here. */
    #results-frame {
      width: 100%;
      border: none;
      display: block;
      height: 0;
      min-height: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <div class="search-bar">
    <h3>Verfügbare Packages zum Wunschtermin finden</h3>

    <!-- Calendar picker (hidden, positioned by JS) -->
    <div class="picker_dropdown" id="box_start_datecal"
      onmousedown="var e=arguments[0]||window.event;e.stopPropagation();"
      onclick="var e=arguments[0]||window.event;e.stopPropagation();"></div>

    <form id="search-form" action="https://www.planyo.com/booking.php" method="get" target="results-frame">
      <input type="hidden" name="calendar" value="46954" />
      <input type="hidden" name="sort_fields" value="name" />
      <input type="hidden" name="sort" value="name" />
      <input type="hidden" name="is_night" value="1" />
      <input type="hidden" name="granulation" value="1440" />
      <input type="hidden" name="mode" value="search" />
      <input type="hidden" name="custom-language" value="DE" />
      <input type="hidden" name="tz_offset" id="tz_offset" value="" />
      <input type="hidden" name="submitted" value="true" />

      <div class="form-row">
        <div class="form-group">
          <label for="box_start_date">Startdatum *</label>
          <div class="input-group" style="display:flex;">
            <input class="with-status-border form-control" type="text" id="box_start_date" name="box_start_date"
              autocomplete="off" placeholder="TT.MM.JJJJ"
              onfocus="planyo_close_calendar();planyo_show_calendar('box_start_date',null);"
              onmousedown="var e=arguments[0]||window.event;e.stopPropagation();"
              onclick="var e=arguments[0]||window.event;e.stopPropagation();"
              style="border-radius:4px 0 0 4px;" />
            <span class="input-group-addon" onclick="planyo_close_calendar();planyo_show_calendar('box_start_date',null);"
              style="cursor:pointer;background:#e9ecef;border:1px solid #ccc;border-left:none;border-radius:0 4px 4px 0;padding:0 10px;display:flex;align-items:center;">
              <a class="planyo-cal-icon" id="box_start_datecalref"
                onclick="planyo_show_calendar('box_start_date',null);"
                style="display:block;width:18px;height:18px;text-decoration:none;">&#160;</a>
            </span>
          </div>
        </div>

        <div class="form-group">
          <label for="box_rental_time_value">Dauer</label>
          <select name="rental_time_value" id="box_rental_time_value">
            <option selected value="168">7 Tage</option>
            <option value="336">14 Tage</option>
            <option value="240">10 Tage</option>
          </select>
        </div>

        <div class="form-group">
          <label>&nbsp;</label>
          <button type="submit" class="btn-search">Suche</button>
        </div>
      </div>
    </form>

    <p class="search-hint">ℹ Für Mai – Oktober als Startdatum bitte Mittwoch oder Samstag wählen!</p>
  </div>

  <!-- Results load here directly, no lightbox -->
  <iframe id="results-frame" name="results-frame" src="about:blank"></iframe>

  <script>
    // Tell the parent page (buchen.tsx) how tall the outer iframe needs to
    // be, so it doesn't reserve a huge empty area before anyone has searched.
    // Kept in its own <script> tag, ahead of the Planyo widget script below:
    // if that external script fails to load (blocked, offline, slow), this
    // sizing logic must still run.
    var expanded = false;

    function reportHeight(h) {
      try { window.parent.postMessage({ source: 'buchen-widget', height: h }, '*'); } catch (e) {}
    }

    function collapsedHeight() {
      var bar = document.querySelector('.search-bar');
      return bar ? Math.ceil(bar.getBoundingClientRect().height) : 260;
    }

    // The date picker (#box_start_datecal) pops open below the start-date
    // field via Planyo's own script (planyo_show_calendar/planyo_close_calendar),
    // toggling its visibility — it's not something we control directly. While
    // collapsed, the outer iframe is only as tall as the search bar, so the
    // open calendar would otherwise get clipped at the iframe's edge, hence
    // the extra height below whenever it's open.
    var picker = document.getElementById('box_start_datecal');
    function pickerExtent() {
      if (!picker) return 0;
      var open = picker.getBoundingClientRect().height > 0 && getComputedStyle(picker).visibility !== 'hidden';
      return open ? Math.ceil(picker.getBoundingClientRect().bottom) + 20 : 0;
    }

    // Single source of truth for "how tall right now" — resize and the
    // picker toggling both funnel through this, so they can't fight each
    // other (setting the outer iframe's height itself fires a resize event
    // inside this frame too, which must land on the same answer).
    function reportCollapsed() {
      if (expanded) return;
      reportHeight(Math.max(collapsedHeight(), pickerExtent()));
    }

    if (picker && 'MutationObserver' in window) {
      var pickerObserver = new MutationObserver(reportCollapsed);
      pickerObserver.observe(picker, { attributes: true, attributeFilter: ['style', 'class'] });
    }

    document.addEventListener('DOMContentLoaded', reportCollapsed);
    window.addEventListener('load', reportCollapsed);
    window.addEventListener('resize', reportCollapsed);

    document.getElementById('search-form').addEventListener('submit', function() {
      expanded = true;
      document.getElementById('results-frame').style.height = '1200px';
      reportHeight(collapsedHeight() + 1240);
    });

    // Auto-grow results iframe (best-effort — the Planyo results page is
    // cross-origin, so this silently no-ops there; the fixed expand above
    // on submit already covers that case).
    document.getElementById('results-frame').addEventListener('load', function() {
      if (!expanded) return;
      try {
        var h = this.contentDocument.body.scrollHeight;
        if (h > 200) {
          this.style.height = (h + 40) + 'px';
          reportHeight(collapsedHeight() + h + 80);
        }
      } catch(e) {}
    });
  </script>

  <script>
    // Set timezone offset
    document.getElementById('tz_offset').value = new Date().getTimezoneOffset();

    // Planyo calendar globals
    document.date_format = "d.m.Y";
    document.first_weekday = 1;
    document.new_scheme = 1;
    document.s_prev = "Vorherige";
    document.s_next = "Nächste";
    document.s_today = "Heute";
    document.s_day = "Tag"; document.s_days = "Tage";
    document.s_week = "Woche"; document.s_weeks = "Wochen";
    document.s_weekday = "Wochentag"; document.s_month = "Monat";
    document.s_single_res = "Einzelne Ressource";
    document.s_weekdays_short = ["M","D","M","D","F","S","S"];
    document.s_weekdays_med = ["Mo","Di","Mi","Do","Fr","Sa","So"];
    document.s_weekdays_long = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
    document.s_months_short = ["Jan","Feb","Mrz","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
    document.s_months_long = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
    document.s_all = "Alle"; document.s_showall = "Alle zeigen";
    document.s_areav = "sind verfügbar.";
    document.s_clickres = "Klicken Sie hier, um eine Buchung vorzunehmen.";
    document.s_partav = "Nur für einen Teil des Tages verfügbar.";
    document.s_outof = "von"; document.s_unav = "Nicht verfügbar"; document.s_av = "Verfügbar";
    document.s_vacation = "Ferien"; document.s_allday = "Ganzer Tag";
    document.s_day_view = "Tag zeigen"; document.s_month_view = "Monat zeigen"; document.s_more = "mehr";

    planyo_set_event(document.getElementById('box_start_datecal'), 'click', 'planyo_dummy', false);
    planyo_set_event(document, 'mousedown', 'planyo_close_calendar', false);
  </script>
</body>
</html>
