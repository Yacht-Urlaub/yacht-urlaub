<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Yacht buchen</title>
  <script type="text/javascript" src="https://www.planyo.com/utils.js"></script>
  <link rel="stylesheet" href="https://www.planyo.com/Plugins/PlanyoFiles/bootstrap-planyo.min.css" type="text/css" />
  <link rel="stylesheet" href="https://www.planyo.com/schemes/?calendar=46954&detect_mobile=auto&sel=scheme_css" type="text/css" />
  <link rel="stylesheet" href="https://www.planyo.com/li.css" type="text/css" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #f4f6f8; font-family: Arial, sans-serif; }

    .search-bar {
      background: #fff;
      border-bottom: 1px solid #e0e4ea;
      padding: 1.5rem 2rem;
      text-align: center;
    }

    .search-bar h3 {
      font-size: 1rem;
      color: #1a6eb5;
      margin: 0 0 1rem 0;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .form-row {
      display: inline-flex;
      align-items: flex-end;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      text-align: left;
    }

    .form-group label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #444;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .form-group input[type="text"],
    .form-group select {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9rem;
      min-width: 160px;
      height: 40px;
      color: #333;
    }

    .form-group input[type="text"]:focus,
    .form-group select:focus {
      outline: none;
      border-color: #1a6eb5;
      box-shadow: 0 0 0 2px rgba(26,110,181,0.15);
    }

    .btn-search {
      background: #1a6eb5;
      color: #fff;
      border: none;
      padding: 0 28px;
      height: 40px;
      border-radius: 4px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .btn-search:hover { background: #155a94; }

    .search-hint {
      font-size: 0.78rem;
      color: #888;
      margin-top: 0.75rem;
      font-style: italic;
    }

    /* Calendar picker */
    .picker_dropdown {
      position: absolute;
      visibility: hidden;
      z-index: 9999;
    }

    /* Vergangene Tage: komplett ausgegraut und nicht anklickbar (Planyo
       selbst markiert sie nicht anders als zukuenftige Tage im selben
       Monat — ohne das wirkt ein bereits verstrichener Tag genauso
       einladend wie ein verfuegbarer, was zu Frust fuehrt). */
    #box_start_datecal td.yu-past {
      color: #ccc !important;
      cursor: not-allowed !important;
      pointer-events: none;
    }

    /* Samstage: bevorzugter Starttag, soll zum Anklicken einladen */
    #box_start_datecal td.yu-saturday:not(.yu-past) {
      background: #e0f2fe;
      color: #0284c7;
      font-weight: 700;
      border-radius: 4px;
    }
    #box_start_datecal td.yu-saturday:not(.yu-past):hover {
      background: #0284c7;
      color: #fff;
    }

    /* Premium-/Hochsaison-Termine (Weihnachten/Neujahr, erste zwei
       August-Wochen): dezentes Kronensymbol als Hinweis */
    #box_start_datecal td.yu-premium:not(.yu-past) {
      position: relative;
      background: #fff7e6;
    }
    #box_start_datecal td.yu-premium:not(.yu-past)::after {
      content: "👑";
      position: absolute;
      top: -3px;
      right: 0;
      font-size: 9px;
      line-height: 1;
    }

    /* Results iframe — collapsed until a search is submitted, since the
       Planyo results page loads cross-origin and its real height can't
       be measured from here. */
    #results-frame {
      width: 100%;
      border: none;
      display: block;
      height: 0;
      min-height: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <div class="search-bar">
    <h3 id="t-heading">Verfügbare Packages zum Wunschtermin finden</h3>

    <!-- Calendar picker (hidden, positioned by JS) -->
    <div class="picker_dropdown" id="box_start_datecal"
      onmousedown="var e=arguments[0]||window.event;e.stopPropagation();"
      onclick="var e=arguments[0]||window.event;e.stopPropagation();"></div>

    <form id="search-form" action="https://www.planyo.com/booking.php" method="get" target="results-frame">
      <input type="hidden" name="calendar" value="46954" />
      <input type="hidden" name="sort_fields" value="name" />
      <input type="hidden" name="sort" value="name" />
      <input type="hidden" name="is_night" value="1" />
      <input type="hidden" name="granulation" value="1440" />
      <input type="hidden" name="mode" value="search" />
      <input type="hidden" name="custom-language" id="custom-language" value="DE" />
      <input type="hidden" name="tz_offset" id="tz_offset" value="" />
      <input type="hidden" name="submitted" value="true" />

      <div class="form-row">
        <div class="form-group">
          <label for="box_start_date" id="t-startdate-label">Startdatum *</label>
          <div class="input-group" style="display:flex;">
            <input class="with-status-border form-control" type="text" id="box_start_date" name="box_start_date"
              autocomplete="off" placeholder="TT.MM.JJJJ"
              onfocus="planyo_close_calendar();planyo_show_calendar('box_start_date',null);"
              onmousedown="var e=arguments[0]||window.event;e.stopPropagation();"
              onclick="var e=arguments[0]||window.event;e.stopPropagation();"
              style="border-radius:4px 0 0 4px;" />
            <span class="input-group-addon" onclick="planyo_close_calendar();planyo_show_calendar('box_start_date',null);"
              style="cursor:pointer;background:#e9ecef;border:1px solid #ccc;border-left:none;border-radius:0 4px 4px 0;padding:0 10px;display:flex;align-items:center;">
              <a class="planyo-cal-icon" id="box_start_datecalref"
                onclick="planyo_show_calendar('box_start_date',null);"
                style="display:block;width:18px;height:18px;text-decoration:none;">&#160;</a>
            </span>
          </div>
        </div>

        <div class="form-group">
          <label for="box_rental_time_value" id="t-duration-label">Dauer</label>
          <select name="rental_time_value" id="box_rental_time_value">
            <option selected value="168" id="t-opt-7">7 Tage</option>
            <option value="336" id="t-opt-14">14 Tage</option>
            <option value="240" id="t-opt-10">10 Tage</option>
          </select>
        </div>

        <div class="form-group">
          <label>&nbsp;</label>
          <button type="submit" class="btn-search" id="t-search-btn">Suche</button>
        </div>
      </div>
    </form>

    <p class="search-hint" id="t-hint">ℹ Für Mai – Oktober als Startdatum bitte Mittwoch oder Samstag wählen!</p>
  </div>

  <script>
    // Sprache kommt per ?lang=en|de von der einbettenden Seite (BuchenPage.tsx,
    // die useLang() kennt) — dieses Fragment laeuft als statisches HTML ausserhalb
    // von React und hat sonst keine Moeglichkeit, die Sprache zu erfahren.
    // Faellt mangels Parameter auf Deutsch zurueck.
    (function () {
      var lang = (new URLSearchParams(window.location.search).get('lang') === 'en') ? 'en' : 'de';
      document.documentElement.lang = lang;

      var T = {
        de: {
          title: 'Yacht buchen', heading: 'Verfügbare Packages zum Wunschtermin finden',
          startdate: 'Startdatum *', duration: 'Dauer',
          d7: '7 Tage', d14: '14 Tage', d10: '10 Tage', search: 'Suche',
          hint: 'ℹ Für Mai – Oktober als Startdatum bitte Mittwoch oder Samstag wählen!',
        },
        en: {
          title: 'Book a yacht', heading: 'Find available packages for your preferred dates',
          startdate: 'Start date *', duration: 'Duration',
          d7: '7 days', d14: '14 days', d10: '10 days', search: 'Search',
          hint: 'ℹ For May – October as a start date, please choose a Wednesday or Saturday!',
        },
      }[lang];

      document.getElementById('page-title').textContent = T.title;
      document.getElementById('t-heading').textContent = T.heading;
      document.getElementById('t-startdate-label').textContent = T.startdate;
      document.getElementById('t-duration-label').textContent = T.duration;
      document.getElementById('t-opt-7').textContent = T.d7;
      document.getElementById('t-opt-14').textContent = T.d14;
      document.getElementById('t-opt-10').textContent = T.d10;
      document.getElementById('t-search-btn').textContent = T.search;
      document.getElementById('t-hint').textContent = T.hint;
      document.getElementById('custom-language').value = lang === 'en' ? 'EN' : 'DE';

      // Placeholder nur an die Sprache angepasst, nicht an die Reihenfolge —
      // document.date_format bleibt unten "d.m.Y" (DD.MM.YYYY), der Kalender
      // liefert also immer in dieser Reihenfolge; ein US-Format MM/DD/YYYY
      // waere hier irrefuehrend, da es nicht dem tatsaechlichen Ergebnis entspricht.
      if (lang === 'en') document.getElementById('box_start_date').placeholder = 'DD.MM.YYYY';

      window.__widgetLang = lang;
    })();
  </script>

  <!-- Results load here directly, no lightbox -->
  <iframe id="results-frame" name="results-frame" src="about:blank"></iframe>

  <script>
    // Tell the parent page (buchen.tsx) how tall the outer iframe needs to
    // be, so it doesn't reserve a huge empty area before anyone has searched.
    // Kept in its own <script> tag, ahead of the Planyo widget script below:
    // if that external script fails to load (blocked, offline, slow), this
    // sizing logic must still run.
    var expanded = false;

    function reportHeight(h) {
      try { window.parent.postMessage({ source: 'buchen-widget', height: h }, '*'); } catch (e) {}
    }

    function collapsedHeight() {
      var bar = document.querySelector('.search-bar');
      return bar ? Math.ceil(bar.getBoundingClientRect().height) : 260;
    }

    // The date picker (#box_start_datecal) pops open below the start-date
    // field via Planyo's own script (planyo_show_calendar/planyo_close_calendar),
    // toggling its visibility — it's not something we control directly. While
    // collapsed, the outer iframe is only as tall as the search bar, so the
    // open calendar would otherwise get clipped at the iframe's edge, hence
    // the extra height below whenever it's open.
    var picker = document.getElementById('box_start_datecal');
    function pickerExtent() {
      if (!picker) return 0;
      var open = picker.getBoundingClientRect().height > 0 && getComputedStyle(picker).visibility !== 'hidden';
      return open ? Math.ceil(picker.getBoundingClientRect().bottom) + 20 : 0;
    }

    // Single source of truth for "how tall right now" — resize and the
    // picker toggling both funnel through this, so they can't fight each
    // other (setting the outer iframe's height itself fires a resize event
    // inside this frame too, which must land on the same answer).
    function reportCollapsed() {
      if (expanded) return;
      reportHeight(Math.max(collapsedHeight(), pickerExtent()));
    }

    if (picker && 'MutationObserver' in window) {
      var pickerObserver = new MutationObserver(reportCollapsed);
      pickerObserver.observe(picker, { attributes: true, attributeFilter: ['style', 'class'] });
    }

    // Kalender-Tage markieren: vergangene Tage ausgrauen/deaktivieren,
    // Samstage hervorheben, Premium-/Hochsaison-Zeitraeume mit Krone
    // versehen. Planyo verbaut Jahr/Monat/Tag direkt als Klassen pro Zelle
    // (z. B. "cur_month_day wd5 yr2026 mo12 md26") und baut bei jeder
    // Monatsnavigation die komplette Tabelle neu (innerHTML) — deshalb bei
    // jeder Kindknoten-Aenderung erneut anwenden statt nur einmal beim
    // Oeffnen. childList+subtree (nicht attributes), damit das eigene
    // Setzen von Klassen hier keine Beobachtungs-Endlosschleife ausloest.
    function isPremiumDate(month, day) {
      if (month === 12 && day >= 24) return true;
      if (month === 1 && day <= 6) return true;
      if (month === 8 && day <= 15) return true;
      return false;
    }

    function enhanceCalendarDays() {
      if (!picker) return;
      var today = new Date();
      today.setHours(0, 0, 0, 0);
      var cells = picker.querySelectorAll('td[class*="yr"]');
      for (var i = 0; i < cells.length; i++) {
        var td = cells[i];
        var yr = td.className.match(/\byr(\d+)\b/);
        var mo = td.className.match(/\bmo(\d+)\b/);
        var md = td.className.match(/\bmd(\d+)\b/);
        if (!yr || !mo || !md) continue;
        var year = parseInt(yr[1], 10), month = parseInt(mo[1], 10), day = parseInt(md[1], 10);
        var cellDate = new Date(year, month - 1, day);
        var premium = isPremiumDate(month, day);

        td.classList.toggle('yu-past', cellDate < today);
        td.classList.toggle('yu-saturday', cellDate.getDay() === 6);
        td.classList.toggle('yu-premium', premium);
        td.title = premium
          ? (window.__widgetLang === 'en' ? 'Premium date (high season)' : 'Premium-Termin (Hochsaison)')
          : '';
      }
    }

    if (picker && 'MutationObserver' in window) {
      new MutationObserver(enhanceCalendarDays).observe(picker, { childList: true, subtree: true });
    }
    enhanceCalendarDays();

    document.addEventListener('DOMContentLoaded', reportCollapsed);
    window.addEventListener('load', reportCollapsed);
    window.addEventListener('resize', reportCollapsed);

    document.getElementById('search-form').addEventListener('submit', function() {
      expanded = true;
      document.getElementById('results-frame').style.height = '1200px';
      reportHeight(collapsedHeight() + 1240);
    });

    // Auto-grow results iframe (best-effort — the Planyo results page is
    // cross-origin, so this silently no-ops there; the fixed expand above
    // on submit already covers that case).
    document.getElementById('results-frame').addEventListener('load', function() {
      if (!expanded) return;
      try {
        var h = this.contentDocument.body.scrollHeight;
        if (h > 200) {
          this.style.height = (h + 40) + 'px';
          reportHeight(collapsedHeight() + h + 80);
        }
      } catch(e) {}
    });
  </script>

  <script>
    // Set timezone offset
    document.getElementById('tz_offset').value = new Date().getTimezoneOffset();

    // Planyo calendar globals — englische Strings fuer den Kalender-Picker
    // und die Suchergebnisse, wenn ?lang=en gesetzt ist (siehe Skript weiter oben).
    document.date_format = "d.m.Y";
    document.first_weekday = 1;
    document.new_scheme = 1;
    if (window.__widgetLang === 'en') {
      document.s_prev = "Previous";
      document.s_next = "Next";
      document.s_today = "Today";
      document.s_day = "Day"; document.s_days = "Days";
      document.s_week = "Week"; document.s_weeks = "Weeks";
      document.s_weekday = "Weekday"; document.s_month = "Month";
      document.s_single_res = "Single resource";
      document.s_weekdays_short = ["M","T","W","T","F","S","S"];
      document.s_weekdays_med = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
      document.s_weekdays_long = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
      document.s_months_short = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      document.s_months_long = ["January","February","March","April","May","June","July","August","September","October","November","December"];
      document.s_all = "All"; document.s_showall = "Show all";
      document.s_areav = "are available.";
      document.s_clickres = "Click here to make a booking.";
      document.s_partav = "Only available for part of the day.";
      document.s_outof = "of"; document.s_unav = "Not available"; document.s_av = "Available";
      document.s_vacation = "Vacation"; document.s_allday = "All day";
      document.s_day_view = "Show day"; document.s_month_view = "Show month"; document.s_more = "more";
    } else {
      document.s_prev = "Vorherige";
      document.s_next = "Nächste";
      document.s_today = "Heute";
      document.s_day = "Tag"; document.s_days = "Tage";
      document.s_week = "Woche"; document.s_weeks = "Wochen";
      document.s_weekday = "Wochentag"; document.s_month = "Monat";
      document.s_single_res = "Einzelne Ressource";
      document.s_weekdays_short = ["M","D","M","D","F","S","S"];
      document.s_weekdays_med = ["Mo","Di","Mi","Do","Fr","Sa","So"];
      document.s_weekdays_long = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
      document.s_months_short = ["Jan","Feb","Mrz","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
      document.s_months_long = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
      document.s_all = "Alle"; document.s_showall = "Alle zeigen";
      document.s_areav = "sind verfügbar.";
      document.s_clickres = "Klicken Sie hier, um eine Buchung vorzunehmen.";
      document.s_partav = "Nur für einen Teil des Tages verfügbar.";
      document.s_outof = "von"; document.s_unav = "Nicht verfügbar"; document.s_av = "Verfügbar";
      document.s_vacation = "Ferien"; document.s_allday = "Ganzer Tag";
      document.s_day_view = "Tag zeigen"; document.s_month_view = "Monat zeigen"; document.s_more = "mehr";
    }

    planyo_set_event(document.getElementById('box_start_datecal'), 'click', 'planyo_dummy', false);
    planyo_set_event(document, 'mousedown', 'planyo_close_calendar', false);
  </script>
</body>
</html>
