<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Seite nicht gefunden | Yacht-Urlaub</title>
<style>
  :root { --navy:#071b2f; --gold:#c9a227; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--navy); color:#fff; font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
         padding:2rem; text-align:center; }
  .box { max-width:520px; }
  .code { font-size:0.72rem; letter-spacing:0.25em; text-transform:uppercase; color:var(--gold); margin-bottom:1rem; }
  h1 { font-size:clamp(1.5rem,4vw,2.25rem); margin:0 0 1rem; line-height:1.25; }
  p { color:rgba(255,255,255,0.75); line-height:1.65; margin:0 0 0.75rem; font-size:0.95rem; }
  .en { color:rgba(255,255,255,0.5); font-size:0.88rem; }
  .links { margin-top:2rem; display:flex; gap:0.75rem; justify-content:center; flex-wrap:wrap; }
  a { display:inline-block; padding:12px 24px; border-radius:4px; text-decoration:none;
      font-size:0.82rem; font-weight:600; letter-spacing:0.04em; }
  .primary { background:var(--gold); color:var(--navy); }
  .ghost { border:1px solid rgba(255,255,255,0.3); color:#fff; }
</style>
</head>
<body>
  <div class="box">
    <p class="code">Fehler 404</p>
    <h1>Diese Seite gibt es nicht mehr</h1>
    <p>Der Inhalt wurde verschoben oder entfernt. Über die Startseite finden Sie alles Weitere.</p>
    <p class="en">This page no longer exists. Please continue from the home page.</p>
    <div class="links">
      <a class="primary" href="https://www.yacht-urlaub.net/">Zur Startseite</a>
      <a class="ghost" href="https://www.yacht-holiday.net/">English site</a>
    </div>
  </div>
</body>
</html>
