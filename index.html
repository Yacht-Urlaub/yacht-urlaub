<!doctype html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Minimaler Fallback, bevor React mountet bzw. fuer Routen ohne eigenen
         Snapshot (siehe scripts/prerender.cjs). Title/Description/OG/Twitter
         NICHT hier hart codieren: react-helmet-async (SEO.tsx) haengt seine
         Tags nur an, statt die hier vorhandenen zu ersetzen — zwei <meta
         name="description"> mit unterschiedlichem Inhalt sind fuer Crawler
         ohne JavaScript (WhatsApp, GPTBot, ...) nicht zuverlaessig
         aufloesbar, welcher gilt. Title ist die eine Ausnahme: der Browser
         (und ein einfacher Parser) nimmt per Spezifikation ohnehin den
         ERSTEN <title> im <head>, und react-helmet-async fuegt seinen genau
         dort ein — ein statischer Platzhalter hier ist also harmlos. */ -->
    <title>Yacht-Urlaub – A Taste of Paradise | Segel- & Yachtreisen</title>
    <meta name="keywords" content="Yachtreisen, Segelurlaub, Kroatien segeln, Karibik segeln, Seychellen, Katamaran, Yacht Charter, Skipperreise" />
    <meta name="author" content="YACHT-URLAUB Ing. Manuel Göschl, MBA" />
    <meta name="robots" content="index, follow" />
    <meta property="og:site_name" content="Yacht-Urlaub" />

    <!-- Title/Description/Open-Graph/Twitter/Schema.org werden pro Seite von
         SEO.tsx (react-helmet-async) gesetzt und fuer die Startseite sowie
         alle Unterseiten zusaetzlich von scripts/prerender.cjs als
         statisches HTML eingefroren (public/<pfad>/index.html). -->
  </head>

        if (document.querySelector('script[src*="' + _tsid + '"]')) return;
        _tsConfig = {
          'yOffset': '5',
          'variant': 'custom_reviews',
          'customElementId': 'MyCustomTrustbadge',
          'trustcardDirection': 'topRight',

      })();
    </script>
