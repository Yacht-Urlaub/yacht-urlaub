    <!-- Minimaler Fallback, bevor React mountet bzw. fuer Routen ohne eigenen

         ohne JavaScript (WhatsApp, GPTBot, ...) nicht zuverlaessig
         aufloesbar, welcher gilt. Title ist die eine Ausnahme: der Browser
         (und ein einfacher Parser) nimmt per Spezifikation ohnehin den
         ERSTEN <title> im <head>, und react-helmet-async fuegt seinen genau
         dort ein — ein statischer Platzhalter hier ist also harmlos. */ -->

    <!-- Trusted Shops rendert sein Badge trotz #MyCustomTrustbadge (oben,
         links positioniert) rechts unten, direkt über dem WhatsApp-Button
         — per DevTools geprüft: nicht per Stylesheet, sondern per
         Inline-Style mit !important auf jeder einzelnen Eigenschaft. Eine
         externe CSS-Regel kann Inline-!important grundsätzlich nicht
         schlagen (das ist die höchste Prioritätsstufe der CSS-Kaskade) —
         nur direktes Ueberschreiben per JS mit derselben Prioritaet
         gewinnt. ID-Praefix statt exakter ID, da die Instanz-ID pro
         Seitenaufruf wechselt. MutationObserver, weil das Widget erst
         asynchron nachlaedt und seine Inline-Styles auch danach noch
         neu setzen kann (z. B. responsive bei Resize).

         Wichtig: #trustbadge-container-<hash> (Grosseltern-Container der
         Buttons) UND mindestens ein dazwischenliegender Wrapper-Div
         (Trusted-Shops-interne, buildspezifisch gehashte CSS-Modul-
         Klassen wie "_uuhri8"/"_1y0juye", nicht stabil über Updates des
         Fremdskripts hinweg) tragen jeweils eigene position:fixed/
         absolute mit eigenem rechts-Offset per externer CSS-Regel.
         left/right nur auf Container ODER nur auf den Buttons reicht
         daher nicht — es muss auf JEDEM positionierten Vorfahren
         zwischen Button und <body> erzwungen werden. Statt die
         Hash-Klassen hart zu codieren (koennten sich mit jedem
         Trusted-Shops-Update aendern), daher generischer Ansatz:
         von jedem Treffer aus die Elternkette hochlaufen und auf
         jedem Element mit computed position fixed/absolute/sticky
         ebenfalls left/right per Inline-!important erzwingen. -->
    <script type="text/javascript">
      (function () {
        var SELECTOR = '[id^="minimized-trustbadge-"], [id^="trustbadge-minimized-menu-button-"], [id^="trustbadge-container-"]';
        function forceLeft(el) {
          el.style.setProperty('left', '20px', 'important');
          el.style.setProperty('right', 'auto', 'important');
        }
        function forceLeftChain(el) {
          var node = el;
          while (node && node.nodeType === 1 && node !== document.body) {
            var pos = window.getComputedStyle(node).position;
            if (pos === 'fixed' || pos === 'absolute' || pos === 'sticky') {
              forceLeft(node);
            }
            node = node.parentElement;
          }
        }
        function fixAll(root) {
          if (root.matches && root.matches(SELECTOR)) forceLeftChain(root);
          if (root.querySelectorAll) {
            root.querySelectorAll(SELECTOR).forEach(forceLeftChain);
          }
        }
        var observer = new MutationObserver(function (mutations) {
          mutations.forEach(function (m) {
            if (m.type === 'attributes') {
              document.querySelectorAll(SELECTOR).forEach(forceLeftChain);
            }
            m.addedNodes && m.addedNodes.forEach(function (n) {
              if (n.nodeType === 1) fixAll(n);
            });
          });
        });
        observer.observe(document.documentElement, {
          childList: true, subtree: true, attributes: true, attributeFilter: ['style'],
        });
        fixAll(document.documentElement);
      })();
    </script>
