# --- 3c. Reste des alten TYPO3: echter 404 ---
#      Bilder und Dokumente der Altseite sind indexiert. Ohne diese Regeln
#      liefert der SPA-Fallback HTML mit Status 200 unter einer .jpg- oder
#      .pdf-Adresse — fuer Suchmaschinen ein falsches Signal.

[[redirects]]
  from = "/fileadmin/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/typo3/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/typo3conf/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/typo3temp/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/t3lib/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/form/*"
  to = "/404.html"
  status = 404
  force = true

# --- 4. SPA-Fallback: muss die LETZTE Regel bleiben ---
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
