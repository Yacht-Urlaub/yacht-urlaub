[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# ==========================================================================
# 301-Weiterleitungen der alten TYPO3-Seite (yacht-urlaub.net / yacht-holiday.net)
# Quellen: dd_googlesitemap der Altseite + vollstaendiger Crawl beider Domains,
#          Stand 08/2026 (113 Seiten, 99 Sitemap-Pfade, 25 nur verlinkte Seiten).
# Zweck:   etablierte Rankings, Fremdlinks und bezahlte Anzeigen-Ziele erhalten.
#
# Reihenfolge ist bindend: exakte Pfade zuerst, dann Auffangregeln je Bereich,
# dann der SPA-Fallback ganz am Ende.
# ==========================================================================

