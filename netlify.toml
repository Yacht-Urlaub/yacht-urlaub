[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# ==========================================================================
# Weiterleitungen fuer den Zwei-Domain-Betrieb
#
#   yacht-urlaub.net    Deutsch
#   yacht-holiday.net   Englisch (ohne /en-Praefix in der Adresse)
#
# 28 der 53 alten englischen Adressen sind mit der neuen Struktur identisch
# und brauchen deshalb gar keine Regel — sie funktionieren unveraendert
# weiter. Nur die abweichenden stehen hier.
#
# Reihenfolge ist bindend:
#   1. Regeln der EN-Domain (host-gebunden, sonst greifen unten die
#      pfadgleichen DE-Regeln — z. B. /toernbericht/*)
#   2. /en/* der DE-Domain auf die EN-Domain
#   3. Regeln der DE-Domain
#   4. SPA-Fallback ganz am Ende
#
# Auffangregeln (/pfad/*) duerfen NIE auf ihren eigenen Elternpfad zeigen:
# Netlify laesst den Splat auch leer matchen, die Regel traefe damit sich
# selbst und antwortet mit 404.
# ==========================================================================

# --- 0. Englische Apex-Domain auf www ---
#     Netlify leitet Apex->www nur fuer die Primaerdomain automatisch um;
#     yacht-holiday.net haengt nur als Alias und lieferte sonst unter beiden
#     Adressen aus (Doppelinhalte).

[[redirects]]
  from = "https://yacht-holiday.net/*"
  to = "https://www.yacht-holiday.net/:splat"
  status = 301
  force = true

